<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Configuración - LegalTechAI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet" />
    <style>
      :root {
        --primary-color: #2c3e50;
        --secondary-color: #3498db;
        --background-color: #f8f9fa;
      }

      body {
        background-color: var(--background-color);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      .settings-container {
        max-width: 800px;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      .settings-section {
        margin-bottom: 2rem;
        padding: 1rem;
        border-radius: 8px;
        background: #f8f9fa;
      }

      .form-switch {
        padding-left: 2.5em;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
      <div class="container">
        <a class="navbar-brand" href="/dashboard">
          <i class="fas fa-gavel me-2"></i>LegalTechAI
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="/dashboard">
                <i class="fas fa-home me-2"></i>Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/dashboard/profile">
                <i class="fas fa-user me-2"></i>Perfil
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="/dashboard/settings">
                <i class="fas fa-cog me-2"></i>Configuración
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container settings-container">
      <h2 class="mb-4">Configuración</h2>

      <!-- Notifications Settings -->
      <div class="settings-section">
        <h4>Notificaciones</h4>
        <hr />
        <div class="mb-3 form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="emailNotifications"
            checked />
          <label class="form-check-label" for="emailNotifications"
            >Notificaciones por Email</label
          >
        </div>
        <div class="mb-3 form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="pushNotifications" />
          <label class="form-check-label" for="pushNotifications"
            >Notificaciones Push</label
          >
        </div>
      </div>

      <!-- Privacy Settings -->
      <div class="settings-section">
        <h4>Privacidad</h4>
        <hr />
        <div class="mb-3 form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="profileVisibility"
            checked />
          <label class="form-check-label" for="profileVisibility"
            >Perfil Público</label
          >
        </div>
        <div class="mb-3 form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="activityTracking"
            checked />
          <label class="form-check-label" for="activityTracking"
            >Seguimiento de Actividad</label
          >
        </div>
      </div>

      <!-- Language Settings -->
      <div class="settings-section">
        <h4>Idioma y Región</h4>
        <hr />
        <div class="mb-3">
          <label for="language" class="form-label">Idioma</label>
          <select class="form-select" id="language">
            <option value="es">Español</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="timezone" class="form-label">Zona Horaria</label>
          <select class="form-select" id="timezone">
            <option value="America/Bogota">Bogotá (GMT-5)</option>
            <option value="America/Mexico_City">
              Ciudad de México (GMT-6)
            </option>
            <option value="America/Santiago">Santiago (GMT-4)</option>
          </select>
        </div>
      </div>

      <div class="mt-4">
        <button class="btn btn-primary">Guardar Cambios</button>
        <button class="btn btn-secondary ms-2">Cancelar</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
