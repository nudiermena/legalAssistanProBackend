        --accent-color: #e74c3c;

      .navbar {

        font-weight: 600;

        padding-bottom: 1rem;
        border-bottom: 2px solid var(--secondary-color);

      .card {
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease;
      }

      .card:hover {
        transform: translateY(-5px);
      }

      .card-header {
        background-color: var(--primary-color);
        color: white;
        border-radius: 10px 10px 0 0 !important;
        padding: 1rem 1.5rem;
      }

      .card-title {

      }

      }

        font-weight: 500;
        color: var(--primary-color);
        margin-bottom: 0.5rem;

        border: 1px solid var(--border-color);
        border-radius: 5px;
        padding: 0.75rem;
        transition: border-color 0.2s ease;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: var(--secondary-color);
        box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
      }

      .document-preview {
        background-color: white;
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 2rem;
        margin-top: 1rem;
        white-space: pre-wrap;
        font-family: "Courier New", Courier, monospace;
        font-size: 0.9rem;
        line-height: 1.6;
        max-height: 600px;
        overflow-y: auto;

      .validation-warning {
        color: #f39c12;
      }

      .validation-error {
        color: var(--accent-color);
      }

      .parameter-group {
        background-color: white;
        border-radius: 10px;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        border: 1px solid var(--border-color);

      .loading {
        display: none;
        text-align: center;
        padding: 3rem;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 10px;
        position: absolute;

        left: 0;
        right: 0;
        bottom: 0;

      // Función para generar los campos del formulario
      function generateFormFields(documentType) {
        const container = document.getElementById("parametersContainer");
        container.innerHTML = "";

        if (!documentType || !documentParameters[documentType]) {
          return;
        }

        const parameters = documentParameters[documentType];
        parameters.forEach((param) => {
          const div = document.createElement("div");
          div.className = "mb-3";

          const label = document.createElement("label");
          label.className = "form-label";
          label.textContent = param.label;
          label.htmlFor = param.name;

          let input;
          if (param.type === "textarea") {
            input = document.createElement("textarea");
            input.className = "form-control";
            input.rows = 3;
          } else {
            input = document.createElement("input");
            input.className = "form-control";
            input.type = param.type;
          }

          input.id = param.name;
          input.name = param.name;
          input.required = param.required;

          div.appendChild(label);
          div.appendChild(input);
          container.appendChild(div);
        });
      }

      // Evento para cambiar el tipo de documento
      document
        .getElementById("documentType")
        .addEventListener("change", function (e) {
          generateFormFields(e.target.value);
        });

      // Función para mostrar mensajes de validación
      function showValidation(validation) {
        const validationDiv = document.getElementById("validation");
        const validationList = document.getElementById("validationList");
        validationList.innerHTML = "";

        if (
          validation.warnings.length > 0 ||
          validation.missing_elements.length > 0
        ) {
          validationDiv.style.display = "block";

          if (validation.missing_elements.length > 0) {
            const errorLi = document.createElement("li");
            errorLi.className = "validation-error";
            errorLi.innerHTML =
              '<i class="fas fa-exclamation-circle me-2"></i>Elementos requeridos faltantes:';
            const errorUl = document.createElement("ul");
            validation.missing_elements.forEach((element) => {
              const li = document.createElement("li");
              li.textContent = element;
              errorUl.appendChild(li);
            });
            errorLi.appendChild(errorUl);
            validationList.appendChild(errorLi);
          }

          if (validation.warnings.length > 0) {
            const warningLi = document.createElement("li");
            warningLi.className = "validation-warning";
            warningLi.innerHTML =
              '<i class="fas fa-exclamation-triangle me-2"></i>Advertencias:';
            const warningUl = document.createElement("ul");
            validation.warnings.forEach((warning) => {
              const li = document.createElement("li");
              li.textContent = warning;
              warningUl.appendChild(li);
            });
            warningLi.appendChild(warningUl);
            validationList.appendChild(warningLi);
          }
        } else {
          validationDiv.style.display = "none";
        }
      }

      // Función para descargar el documento
      async function downloadDocument(content, documentType) {
        try {
          // Show loading indicator
          document.getElementById("loading").style.display = "block";

          // Call the Word download endpoint
          const response = await fetch("/download-document", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              content: content,
              document_type: documentType,
            }),
          });

          if (!response.ok) {
            throw new Error("Error al generar el documento Word");
          }

          // Get the blob from the response
          const blob = await response.blob();

          // Create a URL for the blob
          const url = window.URL.createObjectURL(blob);

          // Create a temporary link element
          const a = document.createElement("a");
          a.href = url;
          a.download = `${documentType}_${
            new Date().toISOString().split("T")[0]
          }.docx`;

          // Append to body, click, and cleanup
          document.body.appendChild(a);
          a.click();
          window.URL.revokeObjectURL(url);
          document.body.removeChild(a);

          showToast("Documento descargado exitosamente");
        } catch (error) {
          console.error("Error downloading document:", error);
          showToast("Error al descargar el documento");
        } finally {
          document.getElementById("loading").style.display = "none";
        }
      }

      // Add this helper function at the top of your script section
      function formatParties(parameters, documentType) {
        const partyMappings = {
          contrato_laboral: {
            party1: { field: "empleador", role: "Empleador" },
            party2: { field: "trabajador", role: "Trabajador" },
          },
          contrato_prestacion_servicios: {
            party1: { field: "contratante", role: "Contratante" },
            party2: { field: "contratista", role: "Contratista" },
          },
          contrato_arrendamiento: {
            party1: { field: "arrendador", role: "Arrendador" },
            party2: { field: "arrendatario", role: "Arrendatario" },
          },
          // Add other document types as needed
        };

        const mapping = partyMappings[documentType] || {
          party1: { field: "parte_1", role: "Parte 1" },
          party2: { field: "parte_2", role: "Parte 2" },
        };

        return [
          {
            name: parameters[mapping.party1.field] || "",
            role: mapping.party1.role,
          },
          {
            name: parameters[mapping.party2.field] || "",
            role: mapping.party2.role,
          },
        ];
      }

      // Add share functionality
      async function shareDocument(content, documentType) {
        const title = `Documento Legal - ${documentType
          .replace(/_/g, " ")
          .toUpperCase()}`;
        const text = content;
        const url = window.location.href;

        try {
          if (navigator.share) {
            // Use Web Share API if available
            await navigator.share({
              title,
              text,
              url,
            });
          } else {
            // Fallback to clipboard copy
            const plainText = marked.parse(content);
            await navigator.clipboard.writeText(plainText);
            showToast("Documento copiado al portapapeles");
          }
        } catch (error) {
          console.error("Error sharing:", error);
          showToast("Error al compartir el documento");
        }
      }

      function showToast(message) {
        const toastEl = document.querySelector(".toast");
        const toastBody = toastEl.querySelector(".toast-body");
        toastBody.textContent = message;

        const toast = new bootstrap.Toast(toastEl);
        toast.show();
      }

      // Update the form submission handler
      document
        .getElementById("documentForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const documentType = document.getElementById("documentType").value;
          const language = document.getElementById("language").value;

          // Collect form data
          const formData = new FormData(this);
          const parameters = {};
          for (const [key, value] of formData.entries()) {
            if (key !== "documentType" && key !== "language") {
              parameters[key] = value;
            }
          }

          // Format the request body according to the API requirements
          const requestBody = {
            document_type: documentType,
            jurisdiction: "Colombia",
            key_requirements: Object.entries(parameters).map(
              ([key, value]) => `${key}: ${value}`
            ),
            parties: formatParties(parameters, documentType),
            legal_terms: [],
            data_processing: {
              type: "personal",
              consent: "explicit",
            },
          };

          // Show loading indicator
          document.getElementById("loading").style.display = "block";
          document.getElementById("documentPreview").style.display = "none";
          document.getElementById("downloadBtn").disabled = true;

          try {
            const response = await fetch("/api/v1/draft-document", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(requestBody),
            });

            if (!response.ok) {
              const errorData = await response.json();
              throw new Error(
                errorData.detail || "Error en la generación del documento"
              );
            }

            const result = await response.json();

            // Show the document with markdown rendering
            const previewDiv = document.getElementById("documentPreview");
            if (result.document && result.document.content) {
              // Parse markdown and render as HTML
              previewDiv.innerHTML = marked.parse(result.document.content);
            } else {
              previewDiv.innerHTML = "<p>No document content available.</p>";
            }
            previewDiv.style.display = "block";

            // Show validation
            showValidation(
              result.validation || { warnings: [], missing_elements: [] }
            );

            // Enable share and download buttons
            const shareBtn = document.getElementById("shareBtn");
            const downloadBtn = document.getElementById("downloadBtn");

            shareBtn.disabled = false;
            downloadBtn.disabled = false;

            shareBtn.onclick = () =>
              shareDocument(result.document.content, documentType);
            downloadBtn.onclick = () =>
              downloadDocument(result.document.content, documentType);
          } catch (error) {
            console.error("Error details:", error);
            alert(`Error al generar el documento: ${error.message}`);
          } finally {
            document.getElementById("loading").style.display = "none";
          }
        });
    </script>
  </body>
</html>
